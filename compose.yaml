name: ai-chatbot

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      # POSTGRES_PORT lets local setup avoid a host that already uses 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 keeps data in a versioned directory under this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
