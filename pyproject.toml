[project]
name = "ai-chatbot-backend"
version = "0.1.0"
description = "API for the AI chatbot application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0,<2",
    "asyncpg>=0.31.0,<0.32",
    "email-validator>=2.2.0",
    "fastapi>=0.142.2,<1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy[asyncio]>=2.1.3,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1",
    "httpx2>=2.13.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
